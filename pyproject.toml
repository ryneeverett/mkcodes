[project]
name = "mkcodes"
version = "0.2.0"
description = "A command-line utility for pulling code blocks out of markdown files."
authors = [
  {name = "ryneeverett", email="ryneeverett@gmail.com"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
  "click"
]

[project.optional-dependencies]
markdown = ["Markdown>=3.4.0"]

[project.scripts]
mkcodes = "mkcodes:main"
